[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "validation-suite"
version = "0.1.1"
description = "A unified framework for consistent validation across multiple projects and use cases."
readme = "README.md"
authors = [
  {name = "Cristian C. Sarmiento", email = "ccsarmientot@gmail.com"}
]
maintainers = [
  {name = "Cristian C. Sarmiento", email = "ccsarmientot@gmail.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}

requires-python = ">= 3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.bumpversion]
current_version = "0.1.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "src/validation_suite/__init__.py"